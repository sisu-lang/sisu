# Git hooks, run by prek (https://prek.j178.dev). Install once per clone:
#   prek install
# Run everything by hand: prek run --all-files

[[repos]]
repo = "builtin"
hooks = [
  # The `.in`, `.out` and `.err` files of `run/` and `run-fail/` cases hold raw bytes as a
  # program reads or writes them: tabs, `\r`, `\0`, and a last line with no newline.
  { id = "trailing-whitespace", exclude = '^(crates/sisuc/tests|site/programs)/run(-fail)?/.*\.(in|out|err)$' },
  # `no_trailing_newline.sisu`, `eof-quote.sisu`, `E0093-end-of-file.sisu` and `W0007-places.sisu` must not end in a newline, and the stderr snapshots end in one blank line.
  { id = "end-of-file-fixer", exclude = '^(crates/sisuc/tests/(diagnostics/(.*\.err|no_trailing_newline\.sisu|eof-quote\.sisu|E0093-end-of-file\.sisu|W0007-places\.sisu)|run(-fail)?/.*\.(in|out|err))|site/programs/((diagnostics|explanations)/.*\.err|run(-fail)?/.*\.(in|out|err)))$' },
  { id = "mixed-line-ending", exclude = '^(crates/sisuc/tests|site/programs)/run(-fail)?/.*\.(in|out|err)$' },
  # Without the flag the hook checks nothing outside a merge, so a rebase or CI misses markers.
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --locked -- -D warnings"
# Lint config lives in the manifests, so their changes re-run clippy too.
files = '(\.rs|Cargo\.toml|Cargo\.lock|clippy\.toml)$'
pass_filenames = false

[[repos.hooks]]
id = "expect-messages"
name = "expect messages say should"
language = "system"
entry = "scripts/check-expect-messages.sh"
types = ["rust"]

[[repos.hooks]]
id = "test-wording"
name = "unit tests assert codes, not wording"
language = "system"
entry = "scripts/check-test-wording.sh"
types = ["rust"]

[[repos.hooks]]
id = "registry-no-debug-format"
name = "diagnostic text does not use {:?}"
language = "system"
entry = "python3 scripts/registry_debug_format.py"
files = '^crates/sisuc/src/diagnostic/registry\.rs$'

[[repos.hooks]]
id = "comment-width"
name = "comments fit in 100 columns"
language = "system"
entry = "python3 scripts/comment_width.py"
types = ["rust"]

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos --force-exclude"
types = ["text"]
# Exported diagrams embed font data that reads as misspellings.
exclude = '\.svg$'

[[repos.hooks]]
id = "doc-links"
name = "doc links and paths resolve"
language = "system"
entry = "python3 .agents/skills/update-docs/scripts/check_links.py"
files = '\.md$'

[[repos.hooks]]
id = "python-tests"
name = "script unit tests"
language = "system"
entry = "python3 -m unittest discover -s scripts -p 'test_*.py'"
files = '^scripts/.*\.py$'
pass_filenames = false

# A new diagnostic code needs a category, or the site build fails long after the commit.
[[repos.hooks]]
id = "diagnostic-categories"
name = "each diagnostic code is in one site category"
language = "system"
entry = "uv run --locked --script site/build.py --categories"
files = '^(docs/diagnostics/.*\.md|site/data/categories\.toml)$'
pass_filenames = false

# Reads the report of the last local nextest run and warns about tests over their time budget;
# it never fails a commit. With no report, as in CI's lint job, it prints nothing. It lists only
# the slow tests the change mentions; CI, on its own runner, lists them all.
[[repos.hooks]]
id = "slow-tests"
name = "tests within their time budget (warns only)"
language = "system"
entry = "python3 scripts/slow_tests.py target/nextest/default/junit.xml --diff HEAD"
always_run = true
pass_filenames = false
verbose = true

# Preinstalled on GitHub's Ubuntu runners.
[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
types = ["shell"]

# Lints .github/workflows, including `run:` scripts through shellcheck.
# prek builds it with its own Go toolchain, so it needs no local install.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [{ id = "actionlint" }]
