[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
yanked = "deny"

[licenses]
# Unicode-3.0: unicode-ident (via syn, a build-time dependency of inkwell).
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
# Workspace crates are `publish = false`; cargo-deny does not check their own license.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# inkwell's master, pinned to a commit in crates/sisuc/Cargo.toml, until a
# release has llvm23-1 (docs/llvm.md).
allow-git = ["https://github.com/TheDan64/inkwell"]
