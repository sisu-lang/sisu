nextest-version = { recommended = "0.9.91" }
experimental = ["setup-scripts"]

[scripts.setup.build-runtime]
command = "scripts/build-runtime.sh"

# Every run writes target/nextest/<profile>/junit.xml, which scripts/slow_tests.py reads.
[profile.default.junit]
path = "junit.xml"

[profile.ci]
# Report every failure, not just the first.
fail-fast = false
failure-output = "immediate-final"

# Leaves are `test(=name)` or `test(substring)`; `scripts/nextest_filters.py` checks that each one
# matches a test.

# A quadratic lexer regression hangs this test instead of failing it, so kill it fast.
[[profile.default.overrides]]
filter = 'test(long_gaps_lex_correctly)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Panic-site locations once scanned the text from the start, so codegen was quadratic and this
# test hangs instead of failing: no step counter sees such a new scan. It runs in under 1 s on a
# developer machine, and its regression takes 15 s or more (a scan from the start, or a line index
# for each site), so the kill is at 6 s: more than 5 times the run alone and less than half of the
# regression.
[[profile.default.overrides]]
filter = 'test(many_panic_sites_should_compile_in_linear_time)'
slow-timeout = { period = "2s", terminate-after = 3 }

# A CI runner is about twice as slow, and coverage makes a test slower, so the kill is at 12 s: the
# same ratios as above.
[[profile.ci.overrides]]
filter = 'test(many_panic_sites_should_compile_in_linear_time)'
slow-timeout = { period = "4s", terminate-after = 3 }

# Each render once cost the whole file, so many diagnostics in a large file were quadratic and
# this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(rendering_many_diagnostics_in_a_large_file_is_linear)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each unclosed string literal once rescanned every earlier diagnostic, so many of them were
# quadratic and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_unclosed_strings_lex_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each `todo!` once scanned the file's line breaks, so many of them were quadratic and this test
# hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_todo_bangs_parse_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each `u8` parameter around a join would check it twice over, so nested joins would be
# exponential and this test would hang instead of failing.
[[profile.default.overrides]]
filter = 'test(nested_joins_check_in_quadratic_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A call `switch(...)` once was parsed twice, as C's `switch` and then as a call, so nested calls
# were exponential and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(nested_switch_calls_parse_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each unreachable alternative once solved the arms above it again to find its covering arm, so
# many of them were quadratic and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_unreachable_rows_check_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A variant pattern once copied its variant's field types before checking its form, so short
# malformed patterns of a wide variant were quadratic and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(malformed_patterns_of_a_wide_variant_check_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Four of these five tests give `exhaust::check` the rows of a huge `match`. A search for a bucket
# or a row's interval, a rescan of every row or of the column, a `push` that walks a whole row, or
# a list of every row that took a row's values is quadratic and hangs instead of failing: no step
# counter sees such a new loop. The fifth, `match_on_many_variants`, checks a source, so that the
# parser and `check/pattern.rs` meet a huge `match`: a search of the variants for each name hangs.
# Each runs in 0.2 to 0.5 s alone on a developer machine, and its regression takes 9 s or more, so
# the kill is at 4 s: 8 times the run alone and less than half of the shortest regression.
[[profile.default.overrides]]
filter = '(test(=check::tests::patterns::variants_should_check_in_linear_time) | test(=check::tests::patterns::literal_arms_should_check_in_linear_time) | test(=check::tests::patterns::long_or_row_should_check_in_linear_time) | test(=check::tests::patterns::takers_should_check_in_linear_time) | test(=check::tests::patterns::match_on_many_variants_should_check_in_linear_time))'
slow-timeout = { period = "2s", terminate-after = 2 }

# A CI runner is about twice as slow, and coverage makes a test slower, so the kill of the same five
# tests is at 8 s: the same ratios as above.
[[profile.ci.overrides]]
filter = '(test(=check::tests::patterns::variants_should_check_in_linear_time) | test(=check::tests::patterns::literal_arms_should_check_in_linear_time) | test(=check::tests::patterns::long_or_row_should_check_in_linear_time) | test(=check::tests::patterns::takers_should_check_in_linear_time) | test(=check::tests::patterns::match_on_many_variants_should_check_in_linear_time))'
slow-timeout = { period = "4s", terminate-after = 2 }

# Without the all-wildcard row cut, coverage meets 2^40 distinct matrices, so this test hangs
# instead of failing.
[[profile.default.overrides]]
filter = 'test(one_named_field_per_arm_checks_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Without memoization, both branches of each field meet the same matrix, 2^39 visits in all, so
# this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(repeated_matrices_check_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Alternatives once expanded eagerly, or without memoization, meet 2^40 rows, so this test hangs
# instead of failing.
[[profile.default.overrides]]
filter = 'test(forty_alternatives)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A guard walked again inside each guard around it is exponential in the depth, so this test
# hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(nested_guards_mark_last_uses)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A harness that writes all of standard input before it reads the output would fill both pipes
# and hang on these tests instead of failing them.
[[profile.default.overrides]]
filter = "binary(programs) & (test(stdin_larger_than_a_pipe_should_come_back_whole) | test(program_exiting_before_its_input_ends_should_exit_normally))"
slow-timeout = { period = "10s", terminate-after = 3 }

# Each word once rescanned the line from its start, so a long line was quadratic and this test
# hangs instead of failing.
[[profile.default.overrides]]
filter = 'binary(programs) & test(words_should_count_a_million_words_in_a_two_mebibyte_line)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Without a size check, sisu reads the whole 1 GiB file and reports each of its NUL bytes, so
# this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(check_should_exit_1_when_the_input_file_is_larger_than_1_gib)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A checker test runs an example from a made-up page, and a reference test runs an example from a
# real page; a mistake in the page or in the checker can make it run for ever, so kill it fast.
# This guards against a mistake; it is not a time check.
[[profile.default.overrides]]
filter = 'binary(reference) | binary(reference_checker)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The program fuzzer's unit tests, and the generator's test that builds and runs long values,
# link the programs they build against target/debug's runtime.
[[profile.default.scripts]]
filter = "package(sisuc) & (kind(test) | test(fuzz_program::) | test(printed_should_bound_the_text_of_the_longest_values))"
setup = "build-runtime"

# The Valgrind tests are the longest, so they start first. A Valgrind run of a case uses
# at most about 80 MB, so no cap on how many run at once is needed.
# The `bless_` tests, `same_named_cases_should_not_share_an_executable_when_run_at_once` and
# `run_case_should_check_and_bless_its_err_file` call `support::run`, which runs Valgrind. So do
# the two tests on invalid UTF-8 and on print buffers, and the seven `o2_calls_marker_` tests.
# The four `selfhost_valgrind_` tests run the lexer in Sisu under Valgrind on two large inputs.
[[profile.default.overrides]]
filter = "binary(programs) & (test(allocation_counts) | test(valgrind_run_should_report_a_leaked_cycle) | test(valgrind_runs_should_refuse_a_mimalloc_build_and_a_stripped_build) | test(read_line_should_return_long_lines_whole_across_buffer_refills) | test(bless_) | test(same_named_cases_should_not_share_an_executable_when_run_at_once) | test(run_case_should_check_and_bless_its_err_file) | test(invalid_utf8_should_become_the_replacement_character_in_input_and_arguments) | test(print_should_allocate_one_buffer_however_much_it_prints) | test(o2_calls_marker_) | test(selfhost_valgrind_))"
priority = 100

# Each case compiles twice and runs under Valgrind, so these are the longest tests and start
# first; a Valgrind run of a case uses at most about 80 MB. A hang is killed after three
# minutes.
[[profile.default.overrides]]
filter = "binary(cases) & (test(run::) | test(run_fail::) | test(site_run::) | test(site_run_fail::))"
priority = 100
slow-timeout = { period = "60s", terminate-after = 3 }
