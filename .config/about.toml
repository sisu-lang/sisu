# The same four licenses as `deny.toml`'s `allow`; a crate under another license fails the build.
accepted = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace crates are `publish = false`; their license is the root `LICENSE`.
private = { ignore = true }
