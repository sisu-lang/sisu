name: Claude review

# On request only: a PR comment that holds "@claude review" starts a review.
# The run uses the Claude subscription of the CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token`). Its findings are advice; CI stays the only
# merge gate. GitHub runs issue_comment workflows from the default branch only.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs; Dependabot bumps them.
jobs:
  review:
    name: Review the PR
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The action trades the OIDC token for a Claude GitHub App token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "This repository has no CLAUDE.md. Read AGENTS.md and CODING_STANDARDS.md first and review the diff against them. Read docs/register.md before you judge a design choice. Find real defects: wrong behaviour, missing tests, broken rules. Do not report style that a linter checks. Put each finding in an inline comment on its line. Write in ASD-STE100 Simplified Technical English. No praise, no filler. Do not change files or push commits."
