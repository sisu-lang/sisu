name: Nightly build
on:
  schedule: [{cron: '17 2 * * *'}]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/nightly-build.yml, install.sh, 'scripts/nightly_*', scripts/test_install.py,
            'scripts/test_nightly_*.py', .github/actions/install-llvm/action.yml, scripts/install-llvm.sh,
            .config/about.toml, .config/about.hbs, '.config/notices/**']
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: {run: {shell: bash}}

# Third-party actions are pinned to commit SHAs, as in ci.yml. A job's `permissions:` replaces the
# workflow's, so each job states `contents` too. A job that reads the picked commit has `pick` in
# `needs:`, because the `needs` context holds direct dependencies only.
jobs:
  pick:
    runs-on: ubuntu-26.04
    permissions: {contents: read, actions: read}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      build: ${{ steps.pick.outputs.build }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/nightly_build.py pick

  build:
    needs: [pick]
    if: needs.pick.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions: {contents: read}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - {target: x86_64-linux,  runner: ubuntu-24.04,     container: 'ubuntu:22.04'}
          - {target: aarch64-linux, runner: ubuntu-24.04-arm, container: 'ubuntu:22.04'}
          - {target: aarch64-macos, runner: macos-15}
    steps:
      - if: matrix.container
        run: apt-get update && apt-get install -y sudo git curl ca-certificates xz-utils zstd build-essential zlib1g-dev libzstd-dev libxml2-dev python3
      - if: runner.os == 'macOS'
        run: brew list zstd || brew install zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pick.outputs.sha }}
      - if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - uses: ./.github/actions/install-llvm
      # Removes the libzstd dylibs, so that the link keeps only `libzstd.a` and the binary needs
      # no Homebrew zstd. The log shows what llvm-config names (llvm-sys 231.0.1, build.rs).
      - if: runner.os == 'macOS'
        run: |
          rm -f "$(brew --prefix zstd)"/lib/libzstd*.dylib /opt/homebrew/lib/libzstd*.dylib
          .llvm/23/bin/llvm-config --system-libs --link-static
      # `cargo build` downloads only what the host needs, and `cargo about --offline` below needs
      # every package of the lock file.
      - run: cargo fetch --locked
      - env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '15.0' || '' }}
        run: cargo build --release --locked --workspace
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-about@0.9.3
      - run: |
          cargo about generate --workspace --all-features --locked --offline --fail -c .config/about.toml -o target/release/THIRD-PARTY-LICENSES.txt .config/about.hbs
          cat .config/notices/LLVM-LICENSE.txt .config/notices/LLVM-EMBEDDED.txt >> target/release/THIRD-PARTY-LICENSES.txt
          sed -e 's/<[^>]*>//g' -e 's/&#34;/"/g' -e "s/&#39;/'/g" -e 's/&#60;/</g' -e 's/&#62;/>/g' "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" >> target/release/THIRD-PARTY-LICENSES.txt
      - if: runner.os == 'macOS'
        run: cat "$(brew --prefix zstd)/LICENSE" >> target/release/THIRD-PARTY-LICENSES.txt
      - run: python3 scripts/nightly_check.py version target/release/sisu ${{ needs.pick.outputs.sha }}
      - if: runner.os == 'Linux'
        run: python3 scripts/nightly_check.py linux target/release/sisu
      - if: runner.os == 'macOS'
        run: python3 scripts/nightly_check.py macos target/release/sisu .llvm/23/lib/libLLVMSupport.a "$(brew --prefix zstd)/lib/libzstd.a"
      - run: python3 scripts/nightly_check.py pack ${{ matrix.target }} target/release target/release/THIRD-PARTY-LICENSES.txt out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: out/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  checksums:
    needs: [pick, build]
    runs-on: ubuntu-26.04
    permissions: {contents: read}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: out
      - run: |
          cd out
          sha256sum sisu-*.tar.gz > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 3
          cp ../install.sh ../site/programs/run/orders.sisu .
      # The tarballs stay out: `publish` collects its six assets by file name from the artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            out/SHA256SUMS
            out/install.sh
            out/orders.sisu
          retention-days: 7
          if-no-files-found: error

  clean-machine:
    needs: [pick, checksums]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions: {contents: read}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04,     image: 'ubuntu:22.04'}
          - {runner: ubuntu-24.04,     image: 'debian:12'}
          - {runner: ubuntu-24.04,     image: 'ubuntu:24.04'}
          - {runner: ubuntu-24.04-arm, image: 'ubuntu:22.04'}
          - {runner: ubuntu-24.04-arm, image: 'debian:12'}
          - {runner: ubuntu-24.04-arm, image: 'ubuntu:24.04'}
          - {runner: macos-15}
          - {runner: macos-26}
    steps:
      - if: matrix.image
        run: apt-get update && apt-get install -y build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dl
      # After checkout, because the Homebrew git of macos-15 needs this zstd for HTTPS.
      - if: runner.os == 'macOS'
        run: brew uninstall --ignore-dependencies --force zstd
      - run: SISU_DOWNLOAD_DIR=$PWD/dl sh dl/install.sh
      # `build` checks the binary before the pack. This checks the tarball that this job installed,
      # for each of the three targets: after "re-run all jobs", `download-artifact` can take a
      # tarball of an earlier attempt, because the largest `id` is not always the newest.
      - run: |
          "$HOME/.sisu/bin/sisu" --version --verbose | grep -Fx "commit: $(printf %.7s '${{ needs.pick.outputs.sha }}')"
      - run: scripts/nightly_smoke.sh "$HOME/.sisu/bin" site/programs/run

  installer-tests:
    needs: [pick, checksums]
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dl
      - run: python3 -m unittest discover -s scripts -p 'test_install.py'
      - run: SISU_ARTIFACTS=$PWD/dl python3 scripts/nightly_installer_real.py

  # It runs no cargo and no action but the checkout. The `timeout-minutes` of the job is the time
  # limit of the whole step, because no step follows it.
  publish:
    needs: [pick, build, checksums, clean-machine, installer-tests]
    if: needs.pick.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions: {contents: write, actions: read}
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly_build.py publish --sha ${{ needs.pick.outputs.sha }}

  live-check:
    needs: [pick, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    permissions: {contents: read}
    timeout-minutes: 15
    steps:
      - run: apt-get update && apt-get install -y curl ca-certificates build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pick.outputs.sha }}
      # The four lines of the Intent, with the real URLs, in an empty directory.
      - run: |
          cd "$(mktemp -d)"
          curl -fsSL https://github.com/sisu-lang/sisu/releases/latest/download/install.sh | sh
          export PATH="$HOME/.sisu/bin:$PATH"
          curl -fsSLO https://github.com/sisu-lang/sisu/releases/latest/download/orders.sisu
          sisu run orders.sisu > "$GITHUB_WORKSPACE/orders.actual"
      - run: diff orders.actual site/programs/run/orders.out

  # The `timeout-minutes` of the job is the time limit of the whole step, because no step follows it.
  prune:
    needs: [publish, live-check]
    runs-on: ubuntu-26.04
    permissions: {contents: write}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly_build.py prune

  report:
    needs: [pick, build, checksums, clean-machine, installer-tests, publish, live-check, prune]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-26.04
    permissions: {contents: read, issues: write}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/nightly_build.py report
