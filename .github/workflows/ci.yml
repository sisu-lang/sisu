name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs; Dependabot bumps them.
# setup-rust-toolchain reads rust-toolchain.toml, caches target/, and sets
# RUSTFLAGS="-D warnings", so any compiler warning fails the build.
jobs:
  lint:
    name: Lint (fmt, clippy, typos, unused dependencies, file hygiene)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek,typos,cargo-shear
      # The diagnostic-categories hook runs site/build.py.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
      # Clippy compiles sisuc, which links LLVM.
      - uses: ./.github/actions/install-llvm
      # The same hooks a local commit runs, over every tracked file.
      - run: prek run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request step below diffs against the merge base with the base branch.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - id: nextest
        run: cargo nextest run --workspace --locked --profile ci
      # The next three steps run when the test step ran, whatever its result; the test-name check
      # runs only on a pull request. `always()` would also
      # run them after a cancel and after a step before the tests failed.
      # Warns about tests over their time budget (CODING_STANDARDS.md, Tests). It never fails the job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: python3 scripts/slow_tests.py target/nextest/ci/junit.xml
      # On a pull request, fails for a test name that the pre-commit hook would reject.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          # The base of the pull request, so a pull request on a stage branch skips the stage below.
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          git -c core.quotepath=off diff -z --name-only --diff-filter=d "$base" -- '*.rs' | xargs -0 --no-run-if-empty python3 scripts/test_names.py --diff "$base"
      # Shows the test health report in the job summary. It never fails the job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            {
              echo '## Test health'
              echo '```'
              python3 scripts/test_health.py target/nextest/ci/junit.xml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fails for a filter leaf of .config/nextest.toml that matches no test. The tests already ran,
      # so the build of the list is cached. A failed `cargo nextest list` fails the step, with its error.
      - if: (success() || failure()) && steps.nextest.outcome == 'success'
        run: |
          cargo nextest list --workspace --locked --message-format json > "$RUNNER_TEMP/list.json"
          python3 scripts/nextest_filters.py .config/nextest.toml "$RUNNER_TEMP/list.json"

  # The same tests on an aarch64 host. It runs on main and by hand, not on every
  # pull request: a pull request can start it with workflow_dispatch on its branch.
  test-arm64:
    name: Test (ARM64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - run: cargo nextest run --workspace --locked --profile ci

  # No Valgrind on macOS: the harness runs those cases natively, and the Linux jobs check for leaks.
  test-macos:
    name: Test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # A cache miss compiles LLVM with llc for about 5 minutes; the tests take about 2.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: cargo nextest run --workspace --locked --profile ci

  # Miri runs the runtime's unit tests in an interpreter that stops at undefined
  # behaviour in its unsafe code; it needs nightly, which overrides rust-toolchain.toml.
  miri:
    name: Miri (runtime)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install nightly --profile minimal --component miri
          rustup override set nightly
          cargo miri setup
      - run: make miri

  deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The Test job runs the site's output checks with the other end-to-end cases;
  # this job builds the site, which needs no Rust and no LLVM. The build loops
  # over every file in docs/diagnostics/, hence the time bound.
  site:
    name: Site (build and checks)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
      - run: make site

  # Informational: every step tolerates failure and each one runs only after its
  # predecessor succeeded, so a failure skips the rest, leaves every check green
  # and is named in the summary.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      NEXTEST_PROFILE: ci
    steps:
      # Depth 2 on a pull request gives the merge commit and its first parent,
      # the base GitHub merged against (the event's base.sha can be stale).
      - id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        if: steps.checkout.outcome == 'success'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - id: tools
        continue-on-error: true
        if: steps.toolchain.outcome == 'success'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.9.1
      - id: llvm
        continue-on-error: true
        if: steps.tools.outcome == 'success'
        uses: ./.github/actions/install-llvm
      - id: valgrind
        continue-on-error: true
        if: steps.llvm.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - id: coverage
        continue-on-error: true
        timeout-minutes: 60
        if: steps.valgrind.outcome == 'success'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: |
          set -o pipefail
          scripts/coverage.sh "$BASE" | tee "$RUNNER_TEMP/coverage.txt"
      - id: summary
        continue-on-error: true
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          rest=
          if [ "$(jq -r '.coverage.outcome' <<<"$STEPS")" = success ]; then
            # stdout may carry lines before the report; it starts at "Coverage:".
            report=$(sed -n '/^Coverage:/,$p' "$RUNNER_TEMP/coverage.txt")
            line=${report%%$'\n'*}
            rest=$(printf '%s\n' "${report#"$line"}" | sed '/./,$!d')
            [ -n "$line" ] || line='Coverage unavailable: no report line.'
          else
            failed=coverage
            for id in checkout toolchain tools llvm valgrind coverage; do
              if [ "$(jq -r --arg id "$id" '.[$id].outcome' <<<"$STEPS")" != success ]; then
                failed=$id
                break
              fi
            done
            line="Coverage unavailable: the $failed step failed."
          fi
          # Write the output first so the comment survives a failed summary write.
          echo "line=$line" >>"$GITHUB_OUTPUT"
          {
            echo "$line"
            if [ -n "$rest" ]; then
              echo
              echo '```text'
              echo "$rest"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - id: comment
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ steps.summary.outputs.line }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          LINE=${LINE:-Coverage unavailable: the summary step failed.}
          body=$(printf '<!-- sisu-coverage -->\n%s' "$LINE")
          # --jq runs per page, so keep only the first id across pages.
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- sisu-coverage -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi
