name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs; Dependabot bumps them.
# setup-rust-toolchain reads rust-toolchain.toml, caches target/, and sets
# RUSTFLAGS="-D warnings", so any compiler warning fails the build.
jobs:
  lint:
    name: Lint (fmt, clippy, typos, unused dependencies, file hygiene)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: prek,typos,cargo-shear
      # The diagnostic-categories hook runs site/build.py.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"
          enable-cache: true
      # Clippy compiles sisuc, which links LLVM.
      - uses: ./.github/actions/install-llvm
      # The same hooks a local commit runs, over every tracked file. The test job runs the
      # architecture test.
      - run: prek run --all-files --show-diff-on-failure
        env:
          SKIP: architecture

  # The tests run in two parts, each on its own runner: `--partition slice:<part>/2` splits the
  # list of tests in turn. A part that fails does not cancel the other.
  test:
    name: Test (part ${{ matrix.part }} of 2)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request step below diffs against the merge base with the base branch.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - id: nextest
        run: cargo nextest run --workspace --locked --profile ci --partition slice:${{ matrix.part }}/2
      # The next five steps run when the test step ran, whatever its result; the filter check runs
      # only when the tests passed. The test-name check runs only on a pull request. These two give
      # the same result in each part, so only part 1 runs them. Each part runs the other steps on
      # its own report. `always()` would also run them after a cancel and after a step before the
      # tests failed.
      # Warns about tests over their time budget (CODING_STANDARDS.md, Tests). It never fails the
      # job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: python3 scripts/slow_tests.py target/nextest/ci/junit.xml
      # On a pull request, fails for a test name that the pre-commit hook would reject.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped' && github.event_name == 'pull_request' && matrix.part == 1
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          # The base of the pull request, so a pull request on a stage branch skips the stage below.
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          git -c core.quotepath=off diff -z --name-only --diff-filter=d "$base" -- '*.rs' | xargs -0 --no-run-if-empty python3 scripts/test_names.py --diff "$base"
      # Shows the test health report in the job summary. It never fails the job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            {
              echo '## Test health'
              echo '```'
              python3 scripts/test_health.py target/nextest/ci/junit.xml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fails for a filter leaf of .config/nextest.toml that matches no test. The tests already ran,
      # so the build of the list is cached. A failed `cargo nextest list` fails the step, with its
      # error.
      - if: (success() || failure()) && steps.nextest.outcome == 'success' && matrix.part == 1
        run: |
          cargo nextest list --workspace --locked --message-format json > "$RUNNER_TEMP/list.json"
          python3 scripts/nextest_filters.py .config/nextest.toml "$RUNNER_TEMP/list.json"
      # Keeps the report, so the time of each test on a runner can be read after the run.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        # A failed upload, such as a full artifact quota, must not fail the required check.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-part-${{ matrix.part }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: warn

  # The ruleset requires a check named `Test`. A part that fails, is cancelled or is skipped fails
  # it.
  test-result:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  # The memory tests of the run cases (ASan, Valgrind, --rc-checks), which the Test job leaves out.
  # They run on main and by hand; `make memory-safety` runs them locally.
  memory-safety:
    name: Memory safety (ASan, Valgrind)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - id: nextest
        run: cargo nextest run --workspace --locked --profile memory
      # Warns about tests over their time budget (CODING_STANDARDS.md, Tests). It never fails the
      # job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: python3 scripts/slow_tests.py target/nextest/memory/junit.xml
      # Shows the test health report in the job summary. It never fails the job.
      - if: (success() || failure()) && steps.nextest.outcome != 'skipped'
        run: |
          if [ -f target/nextest/memory/junit.xml ]; then
            {
              echo '## Test health'
              echo '```'
              python3 scripts/test_health.py target/nextest/memory/junit.xml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same tests on an aarch64 host. It runs on main and by hand, not on every
  # pull request: a pull request can start it with workflow_dispatch on its branch.
  test-arm64:
    name: Test (ARM64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      # They run on main only, so they keep every check of their platform, the memory tests too.
      - run: cargo nextest run --workspace --locked --profile ci --ignore-default-filter

  # No Valgrind on macOS: the harness runs those cases natively, and the Linux jobs check for leaks.
  test-macos:
    name: Test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # A cache miss compiles LLVM with llc for about 5 minutes; the tests take about 2.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/install-llvm
      # They run on main only, so they keep every check of their platform, the memory tests too.
      - run: cargo nextest run --workspace --locked --profile ci --ignore-default-filter

  # Miri runs the runtime's unit tests in an interpreter that stops at undefined
  # behaviour in its unsafe code; it needs nightly, which overrides rust-toolchain.toml.
  miri:
    name: Miri (runtime)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install nightly --profile minimal --component miri
          rustup override set nightly
          cargo miri setup
      - run: make miri

  deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The Test job runs the site's output checks with the other end-to-end cases;
  # this job builds the site, which needs no Rust and no LLVM. The build loops
  # over every file in docs/diagnostics/, hence the time bound.
  site:
    name: Site (build and checks)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"
          enable-cache: true
      - run: make site
