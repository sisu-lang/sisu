name: Fuzz programs

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz, from 60 to 14400
        type: number
        default: 1800
      coverage:
        description: Also measure line coverage per compiler stage
        type: boolean
        default: false
  # A pull request that carries one label `fuzz-program`, `fuzz-program <n>m` or
  # `fuzz-program <n>h` runs it when the label is added and on each push
  # (scripts/fuzz_program_plan.py). This also runs it before the file reaches main, where
  # workflow_dispatch needs it.
  pull_request:
    types: [labeled, synchronize]

# A pull request's run gets these too, and no secrets, and runs only the repository's scripts.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs; Dependabot bumps them.
# The fuzz step decides the job's result: each later step runs only after it
# failed, or tolerates failure. The fuzz step has its own limit (fuzz_minutes() in the
# plan): 15 min of build, the fuzzing or the corpus pass, 17 of crash replays and 3 to
# stop. A fuzz step that passes its limit fails, and the later steps still run, so its
# log and the corpus are kept. Then the job has 15 min of tmin, 20 of cmin, 5 of setup
# and the cache, and 45 of coverage (minutes() in the plan). The 5 minutes are an
# estimate; when they run over, the job loses only Coverage, which runs last.
# The report job comes last: it runs after the fuzz job, only for a failed nightly run.
jobs:
  plan:
    name: Plan the run
    # Skips the pull requests with no label containing fuzz-program before any runner starts;
    # the script still decides from the exact labels. An expression, not shell, so no injection.
    if: github.event_name != 'pull_request' || contains(join(github.event.pull_request.labels.*.name, ','), 'fuzz-program')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      seconds: ${{ steps.plan.outputs.seconds }}
      coverage: ${{ steps.plan.outputs.coverage }}
      fuzz_minutes: ${{ steps.plan.outputs.fuzz_minutes }}
      minutes: ${{ steps.plan.outputs.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Inputs reach the script through env; label text only through the event payload file.
      - id: plan
        env:
          FUZZ_SECONDS: ${{ inputs.seconds }}
          FUZZ_COVERAGE: ${{ inputs.coverage }}
        run: python3 scripts/fuzz_program_plan.py

  fuzz:
    needs: plan
    if: needs.plan.outputs.seconds != ''
    name: Fuzz generated programs
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
    # One run per ref at a time, so a pull request's run and the nightly never wait on each
    # other or on the front-end fuzzer. A push cancels its pull request's run in progress; the
    # nightly never cancels. A skipped job joins another group, so that adding an unrelated
    # label cancels nothing.
    concurrency:
      group: fuzz-program-${{ github.ref }}${{ needs.plan.outputs.seconds == '' && '-skipped' || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: ./.github/actions/install-llvm
      - run: cargo install --locked cargo-fuzz@0.13.2
      # Each run saves under its own key, and the prefix restores the newest one. A pull
      # request's run can restore main's corpus, but what it saves is scoped to its merge ref, so
      # it never reaches main's runs.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/program
          key: fuzz-program-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-program-corpus-
      # The fuzzer first runs each corpus input once, one at a time, at about 1 s each, and
      # -max_total_time does not stop that pass. So a run keeps 1000 inputs at random and removes
      # the others. cmin and the cache then see only those and the new finds, so each run starts
      # with at most 1000. A removed input is lost; the fuzzer can find its coverage again.
      # CORPUS_PASS_MINUTES in scripts/fuzz_program_plan.py is the time of this pass.
      - name: Sample the corpus
        run: |
          before=$(find fuzz/corpus/program -type f 2>/dev/null | wc -l)
          if [ -d fuzz/corpus/program ]; then
            find fuzz/corpus/program -type f -print0 | shuf -z | tail -z -n +1001 | xargs -0r rm --
          fi
          after=$(find fuzz/corpus/program -type f 2>/dev/null | wc -l)
          echo "Kept ${after} of ${before} corpus inputs."
      - id: fuzz
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.fuzz_minutes) }}
        env:
          SECONDS_TO_FUZZ: ${{ needs.plan.outputs.seconds }}
        run: scripts/fuzz.sh --target program "$SECONDS_TO_FUZZ"
      # First, so the raw input, the dump directories of its replays, the log, run record and
      # summary survive anything later.
      - if: always() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-program-failure
          path: fuzz/artifacts/
          if-no-files-found: warn
      - name: Minimize the failing input
        if: always() && steps.fuzz.outcome == 'failure'
        continue-on-error: true
        run: |
          input=
          for class in crash timeout oom; do
            for f in fuzz/artifacts/program/"$class"-*; do
              if [ -f "$f" ]; then
                input=$f
                break 2
              fi
            done
          done
          if [ -z "$input" ]; then
            echo "No failing input to minimize."
            exit 0
          fi
          # A fuzz step stopped by its limit writes no summary, so the line below
          # would be all of it.
          if [ ! -f fuzz/artifacts/summary.md ]; then
            echo "The fuzzer failed before writing a summary; see the log of the fuzz step." >fuzz/artifacts/summary.md
          fi
          status=0
          timeout -k 10 900 scripts/fuzz.sh --target program --tmin "$input" || status=$?
          # Each successful tmin step writes a new minimized-from-<hash> file; the newest is the last step's.
          m=
          for f in fuzz/artifacts/program/minimized-from-*; do
            if [ -f "$f" ] && { [ -z "$m" ] || [ "$f" -nt "$m" ]; }; then
              m=$f
            fi
          done
          if [ -n "$m" ]; then
            printf -- "- Minimized: \`%s\`. Replay: \`scripts/fuzz.sh --target program --replay %s\`.\n" "$m" "$m" >>fuzz/artifacts/summary.md
          fi
          exit "$status"
      - if: always() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-program-minimized
          path: fuzz/artifacts/program/minimized-from-*
          if-no-files-found: ignore
      # The summary's executions count only fork-mode jobs, not the start-up merge of the
      # restored corpus, so a run that only replayed its corpus shows few or "unknown".
      - name: Summary
        if: always() && steps.fuzz.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f fuzz/artifacts/summary.md ]; then
            cat fuzz/artifacts/summary.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "The fuzzer failed before writing a summary; see the log of the fuzz step." >>"$GITHUB_STEP_SUMMARY"
          fi
      # cmin runs last and bounded. A killed or failed cmin leaves the corpus as it was; the
      # sample step caps it next run. The summary's sizes and outcome show it.
      # CMIN_MINUTES in scripts/fuzz_program_plan.py; keep the two equal.
      - name: Minimize the corpus
        if: always() && steps.fuzz.outcome != 'skipped'
        continue-on-error: true
        run: |
          before=$(find fuzz/corpus/program -type f 2>/dev/null | wc -l)
          status=0
          timeout -k 10 1200 scripts/fuzz.sh --target program --cmin >cmin.txt 2>&1 || status=$?
          cat cmin.txt
          after=$(find fuzz/corpus/program -type f 2>/dev/null | wc -l)
          # cargo-fuzz 0.13.2 exits 0 after a failed merge, having printed this line.
          case $status in
            0) if grep -q "Failed to minimize corpus" cmin.txt; then
                 outcome="merge failed; see the step's log"
               else
                 outcome="finished"
               fi ;;
            124) outcome="was stopped at its 1200 s bound" ;;
            137) outcome="was killed (1200 s bound or out of memory)" ;;
            *) outcome="failed with exit status ${status}" ;;
          esac
          {
            echo
            echo "## Corpus"
            echo
            echo "- ${before} inputs before cmin and ${after} after: cmin ${outcome}."
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always() && steps.fuzz.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/program
          key: fuzz-program-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      # Last, after the corpus is saved, and bounded, so a slow measurement loses nothing.
      - name: Coverage
        if: always() && steps.fuzz.outcome != 'skipped' && needs.plan.outputs.coverage == 'true'
        continue-on-error: true
        # COVERAGE_MINUTES in scripts/fuzz_program_plan.py; keep the two equal.
        timeout-minutes: 45
        run: |
          status=0
          scripts/fuzz.sh --target program --coverage >coverage.txt 2>&1 || status=$?
          cat coverage.txt
          {
            echo "## Coverage of the corpus"
            echo
            echo '```'
            grep -E '^(lexer|parser|check|mir|codegen) |^inputs reaching codegen' coverage.txt ||
              echo "No coverage lines: the coverage run exited ${status}; see the step's log."
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # A failed nightly run opens a GitHub issue, or comments on the open one
  # (scripts/fuzz_issue.sh), so a failure does not sit in a step summary that nobody reads. This is
  # the only job with `issues: write`: the job that builds and runs the fuzzer has `contents: read`
  # only. A run started by hand is read by the person who started it, so it opens no issue.
  # The `fuzz` job is skipped, not failed, when `plan` fails, so the condition names `plan` too.
  report:
    name: Report a failed run
    needs: [plan, fuzz]
    # A job stopped at its timeout-minutes ends `cancelled`, as run 41981041579 did. The nightly
    # never cancels for concurrency, so `cancelled` here is such a stop or a cancel by hand.
    if: always() && (needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled' || needs.plan.result == 'failure') && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The summary is in the failure artifact. A run that failed before it wrote one has no
      # artifact, and the script then says so in the issue.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: fuzz-program-failure
          path: fuzz-program-failure
      # The run's URL and the token reach the script through env, never through its text.
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/fuzz_issue.sh program fuzz-program-failure/summary.md
