name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/**
      - bench/**
      - selfhost/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/actions/install-llvm/**
      - scripts/install-llvm.sh
      - codspeed.yml
      - codspeed-main.yml
      - scripts/codspeed-prep.sh
      - .github/workflows/codspeed.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Informational on pull requests: every step before the summary tolerates
# failure and runs only after its predecessor succeeded, so a failure skips
# the rest (nothing is measured or uploaded after a failed prep) and the
# summary names it. On a pull request every check stays green; on a push to
# main the summary step then fails the job, so a benchmark that stops running
# shows on main. Pull requests run codspeed.yml, and pushes to main also run
# codspeed-main.yml, through the merged config that prep writes. The app
# comments on the PR on change.
jobs:
  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-26.04
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        continue-on-error: true
        if: steps.checkout.outcome == 'success'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - id: llvm
        continue-on-error: true
        if: steps.toolchain.outcome == 'success'
        uses: ./.github/actions/install-llvm
      - id: prep
        continue-on-error: true
        if: steps.llvm.outcome == 'success'
        run: scripts/codspeed-prep.sh
      - id: bench
        continue-on-error: true
        timeout-minutes: 60
        if: steps.prep.outcome == 'success'
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          config: ${{ github.event_name == 'push' && '.codspeed-main-merged.yml' || 'codspeed.yml' }}
      - id: summary
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=
          for id in checkout toolchain llvm prep bench; do
            if [ "$(jq -r --arg id "$id" '.[$id].outcome' <<<"$STEPS")" != success ]; then
              failed=$id
              break
            fi
          done
          if [ -z "$failed" ]; then
            line='Benchmarks ran. CodSpeed reports regressions on the PR.'
          else
            line="Benchmarks did not run: the $failed step failed."
          fi
          echo "$line" >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ] && [ "$EVENT" = push ]; then
            echo "::error::$line"
            exit 1
          fi
