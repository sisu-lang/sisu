# Format as in codspeed.yml. Pushes to main run these after codspeed.yml's entries, through .codspeed-main-merged.yml, which scripts/codspeed-prep.sh writes.
benchmarks:
  - name: build_large
    id: build_large
    exec: target/release/sisuc build -O2 target/codspeed/large/main.sisu -o target/codspeed/build_large/main
