# Format read by scripts/codspeed-prep.sh: fixed indent, three lines per entry, plain-word exec (no quotes, backslashes or #), no other comments.
benchmarks:
  - name: fib
    id: fib
    exec: target/codspeed/fib/main
  - name: sieve
    id: sieve
    exec: target/codspeed/sieve/main
  - name: binary_trees
    id: binary_trees
    exec: target/codspeed/binary_trees/main
  - name: quicksort
    id: quicksort
    exec: target/codspeed/quicksort/main
  - name: nbody
    id: nbody
    exec: target/codspeed/nbody/main
  - name: mandelbrot
    id: mandelbrot
    exec: target/codspeed/mandelbrot/main
  - name: fannkuch_redux
    id: fannkuch_redux
    exec: target/codspeed/fannkuch_redux/main
  - name: strings
    id: strings
    exec: target/codspeed/strings/main
  - name: enum_match
    id: enum_match
    exec: target/codspeed/enum_match/main
  - name: shared_arrays
    id: shared_arrays
    exec: target/codspeed/shared_arrays/main
  - name: compare
    id: compare
    exec: target/codspeed/compare/main
  - name: tree_rewrite
    id: tree_rewrite
    exec: target/codspeed/tree_rewrite/main
  - name: interp
    id: interp
    exec: target/codspeed/interp/main
  - name: build_hello
    id: build_hello
    exec: target/release/sisu build -O2 bench/hello/main.sisu -o target/codspeed/build_hello/main
  - name: check_binary_trees
    id: check_binary_trees
    exec: target/release/sisu check bench/binary_trees/main.sisu
  - name: build_binary_trees
    id: build_binary_trees
    exec: target/release/sisu build -O2 bench/binary_trees/main.sisu -o target/codspeed/build_binary_trees/main
  - name: check_large
    id: check_large
    exec: target/release/sisu check target/codspeed/large/main.sisu
  - name: build_large_20
    id: build_large_20
    exec: target/release/sisu build -O2 target/codspeed/large_20/main.sisu -o target/codspeed/build_large_20/main
