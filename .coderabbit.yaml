# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit gives the first review of a PR. CI and prek stay the only merge gate.
# Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US
tone_instructions: "Write in ASD-STE100 Simplified Technical English: short sentences, active voice, one instruction per sentence. No praise, no filler."
reviews:
  profile: chill
  # The summary goes into the bot comment, so the PR body stays as the author wrote it.
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  auto_review:
    drafts: false
    # Review a PR once, when it opens. Each later push gets no review
    # unless a comment asks for one with `@coderabbitai review`.
    auto_incremental_review: false
    # Also review stacked PRs into stage branches.
    base_branches: [".*"]
  path_filters:
    # Stop the default skip of *.out: run-fail .out files are expected output.
    - "**/*.out"
  path_instructions:
    - path: "crates/runtime/**"
      instructions: "C-ABI runtime. Every unsafe block needs a // SAFETY: comment that proves each precondition. Flag behaviour that Miri would reject."
    - path: "crates/sisuc/tests/**"
      instructions: |
        Read the implementation before the changed .err and .json files.
        Compare each expected result with its .sisu input: codes, spans, fixes and exact bytes.
        Do not accept changed expected output only because it matches the implementation.
        The last line of a .json file is a summary. Its "explanations" map holds the text of
        docs/diagnostics/<code>.md for each code that the file reports. A change to that .md file
        changes this line in every .json file that reports the code. Find the changed key before
        you call the change out of scope.
    - path: ".agents/skills/**"
      instructions: "Agents follow these steps literally. Find steps that contradict each other or another skill, a command whose exit status a pipe hides, and a case that no step covers."
    - path: "{scripts,.agents/skills}/**/*.{py,sh}"
      instructions: "Find inputs that make the script report success on a failed or empty run."
    - path: "{docs,site}/**"
      instructions: "Read the code behind each claim about what a command, flag or test does. Report each claim that the code contradicts."
    - path: "crates/sisuc/src/{codegen,mir}/**"
      instructions: "Trace ownership, drops and reference counts through each changed path. Report a value that is dropped twice, never dropped, or used after its drop."
    - path: "crates/sisuc/src/check/**"
      instructions: "One mistake gets one diagnostic. Report an input for which the change gives a second diagnostic for the same root cause, or none."
  finishing_touches:
    docstrings:
      enabled: false
    # Tests are written first and named <subject>_should_<result> (CODING_STANDARDS.md).
    unit_tests:
      enabled: false
  pre_merge_checks:
    # Quoted: YAML 1.1 reads a bare off as false.
    docstrings:
      mode: "off"
    description:
      mode: "off"
    title:
      mode: warning
      requirements: "An imperative sentence in ASD-STE100 English. No Conventional Commits prefix."
    # Advice only: CI stays the merge gate. Each check covers a finding class that came back.
    custom_checks:
      - name: "Docs state observed facts"
        mode: warning
        instructions: |
          For each changed sentence in docs/, site/ or a SKILL.md that states what a command,
          flag or test does, read the code that does it. Fail, and quote each sentence that the
          code contradicts. Pass when no changed sentence makes such a claim.
      - name: "Tests prove their names"
        mode: warning
        instructions: |
          For each new or renamed test, read its name, its doc comment and its assertions.
          Fail when the assertions would still pass if the result that the name or the THEN
          line states did not hold. Quote the test and give the change that would not fail it.
  tools:
    # CI and prek run clippy, ruff, shellcheck and actionlint already.
    # Biome reads the .json test fixtures as code and reports false syntax errors.
    biome:
      enabled: false
    ruff:
      enabled: false
    clippy:
      enabled: false
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    github-checks:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
chat:
  # Reply only when mentioned, not to the comments of other bots.
  auto_reply: false
  art: false
knowledge_base:
  code_guidelines:
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - "**/CODING_STANDARDS.md"
      - "GLOSSARY.md"
      # A plain entry applies only to its own directory, so docs/register.md needs applyTo.
      - files: "docs/register.md"
        applyTo: "**"
  learnings:
    scope: local
