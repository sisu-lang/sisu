[package]
name = "sisuc"
description = "Compiler for the Sisu language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
annotate-snippets = "0.12.16"
rustc-hash = "2.1.3"
# llvm22-1 binds llvm-sys 221, which finds LLVM through LLVM_SYS_221_PREFIX
# (set in .cargo/config.toml).
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
datatest-stable = "0.3.3"
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing"] }

[[test]]
name = "cases"
harness = false
